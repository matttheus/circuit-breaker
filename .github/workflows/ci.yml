name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      load-test:
        description: Run the load tests against the container
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  test:
    name: Lint, type check, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Check formatting
        run: npx prettier --check "src/**/*.ts" "load-tests/**/*.js"

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: circuit-breaker:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show image size
        run: docker image ls circuit-breaker:local

      - name: Start the app with the docker-compose limits
        run: |
          docker compose --profile app up -d --no-build --wait --wait-timeout 120
          curl -sf http://localhost:3000/health
          curl -sf -X POST http://localhost:3000/sync/notifications \
            -H 'content-type: application/json' -d '{}'

      - name: Run load tests (k6)
        if: github.event_name == 'workflow_dispatch' && inputs.load-test
        run: ./load-tests/run.sh

      - name: Upload load test reports
        if: always() && github.event_name == 'workflow_dispatch' && inputs.load-test
        uses: actions/upload-artifact@v4
        with:
          name: load-test-reports
          path: load-tests/reports/
          if-no-files-found: ignore

      - name: Show container logs
        if: failure()
        run: docker compose --profile app logs --no-color

      - name: Tear down
        if: always()
        run: docker compose --profile app down -v
